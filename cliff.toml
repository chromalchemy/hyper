# git-cliff config — renders Conventional Commits into GitHub Release notes.
# Docs: https://git-cliff.org/docs/configuration

[changelog]
# No generated header. CHANGELOG.md keeps its own hand-written preamble, and
# the release task (`bb release`) inserts each new section beneath it. An empty
# header stops git-cliff from duplicating a preamble every time it stamps a
# release.
header = ""
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}- {{ commit.message | upper_first }}\
{% if commit.breaking %} **[breaking]**{% endif %}
{% endfor %}
{% endfor %}
"""
trim = true
footer = ""

[git]
# Parse messages as Conventional Commits (type(scope): description).
conventional_commits = true
# Keep non-conventional commits visible — they fall under "Other".
filter_unconventional = false
filter_commits = false
# Only consider tags shaped like vMAJOR.MINOR.PATCH.
tag_pattern = "v[0-9].*"
# Newest first within each section.
sort_commits = "newest"

# Map commit-message prefixes to changelog sections.
# Anything unmatched falls through into "Other".
commit_parsers = [
  # Drop the release task's own changelog commits so they never show up as
  # entries in a later release.
  { message = "^docs: changelog for v", skip = true },
  { message = "^feat",         group = "Features" },
  { message = "^fix",          group = "Bug Fixes" },
  { message = "^perf",         group = "Performance" },
  { message = "^refactor",     group = "Refactoring" },
  { message = "^docs",         group = "Documentation" },
  { message = "^build",        group = "Build" },
  { message = "^ci",           group = "CI" },
  { message = "^test",         group = "Tests" },
  { message = "^style",        group = "Style" },
  { message = "^(chore|misc)", group = "Miscellaneous" },
]
