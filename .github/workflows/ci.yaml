name: CI

# Runs the shared quality gate on every push to main and every PR. Tag pushes
# are covered by the Release workflow, which runs the same checks before it
# deploys, so there's no separate tag trigger here.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/checks.yaml
