name: Checks

# Reusable workflow holding the full quality gate: build, lint, format-check,
# and tests. Called by CI (on main / PRs) and by Release (as a prerequisite of
# the Clojars deploy) so both share one definition — a release can never skip a
# check that CI enforces.
on:
  workflow_call:

jobs:
  checks:
    name: Lint, Format, Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra_nix_config: |
            substituters = https://cache.nixos.org https://nix-community.cachix.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=

      - name: Enable Nix cache
        uses: Camsbury/magic-nix-cache-action@main
        with:
          use-github-fork: true
          github-fork-repo: Camsbury/magic-nix-cache
          github-fork-ref: latest
          github-fork-asset: magic-nix-cache
          use-flakehub: false

      - name: Cache clojure dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          # List all files containing dependencies:
          key: cljdeps-${{ hashFiles('deps.edn') }}
          restore-keys: cljdeps-

      - name: Build (nix-shell)
        run: nix-shell --run "echo \"finished building.\""
      - name: Lint (clj-kondo)
        run: nix-shell --run "clj-kondo --lint src"
      - name: Format Check (cljfmt)
        run: nix-shell --run "cljfmt check"
      - name: Run Tests
        run: nix-shell --run "clojure -M:main:test"
